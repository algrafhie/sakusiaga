name: Build SakuSiaga APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Siapkan web assets
        run: mkdir -p www && cp index.html www/index.html
      - name: Tambah platform Android
        run: npx cap add android
      - name: Pasang alarm layar penuh
        run: node apply-native.mjs
      - name: Sinkronkan web build
        run: npx cap sync android
      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: sakusiaga-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
